name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Formatting and JVM checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check formatting
        run: ./gradlew spotlessCheck --console=plain
      - name: Check JVM core
        run: ./gradlew :core:check --console=plain
      - name: Build JVM core JAR
        run: ./gradlew :core:build --console=plain
      - name: Upload JVM test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/build/reports/tests/test/
            core/build/test-results/test/
          if-no-files-found: ignore
