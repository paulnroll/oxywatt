name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Formatting and JVM checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check formatting
        run: ./gradlew spotlessCheck --console=plain
      - name: Check JVM core
        run: ./gradlew :core:check --console=plain
      - name: Build JVM core JAR
        run: ./gradlew :core:build --console=plain
      - name: Upload JVM test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/build/reports/tests/test/
            core/build/test-results/test/
          if-no-files-found: ignore

  fit-replay:
    name: Synthetic FIT decoder verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned developer decoder
        run: python -m pip install fitdecode==0.11.0
      - name: Verify FIT projections and malformed input rejection
        run: |
          python tools/verify_fit_replay.py
          python -m unittest discover -s tools -p 'test_export_fit_replay.py'
